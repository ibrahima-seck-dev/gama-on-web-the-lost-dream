<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Dream</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
      }

      #gps-ui {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(0, 0, 0, 0.6);
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 14px;
        color: white;
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: none;
      }

      #gps-arrow {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas" touch-action="none"></canvas>

    <div id="gps-ui">
      <span id="gps-arrow">➡️</span>
      <span id="gps-text">Clé à XX m</span>
    </div>
  </body>
</html>
